<body>

  <div id="kartica" class="kartica svijetla">
    <h2>Moja kartica</h2>
    <p>Ovdje se mijenja tema kartice.</p>
    <button onclick="promijeniTemu()">
      Promijeni temu
    <script>
      let naslov = document.querySelector("h1");
      naslov.innerHTML = "DOM radi";
      let paragraf = document.getElementById("opis");
      paragraf.textContent = "Ja sam Hrvoje";
      let divi = document.getElementById("div1");
      naslov.style.color = "cyan";
      naslov.style.fontSize = "32px";
      divi.style.backgroundColor = "red";
      divi.style.padding = "10px";
      divi.style.textAlign = "center";
      let div2 = document.getElementById("d2");

      let but67 = document.getElementById("b1");
      but67.onclick = function () {
        d2.textContent = "Uspješno ste kliknuli gumb!";
      };

      let d01 = document.querySelectorAll(".d01");
      d01[0].style.color = "lightblue";
      d01[1].style.color = "yellow";
      d01[2].style.color = "purple";

      let but677 = document.getElementById("but677");
      but677.onclick = function () {
        p12.textContent = "Novo upozorenje";
        p12.style.color = "red";
        p12.style.backgroundColor = "yellow";
        p12.style.fontWeight = "bold";
      };

      function toggle() {
        let kartica = document.getElementById("norm1");
        kartica.classList.toggle("istaknuto");
      }

      function toggle2() {
        let par = document.getElementById("p111");
        par.classList.toggle2("sakriveno");

      const slika = document.getElementById("slika");
      const gumb = document.getElementById("gumb");

      gumb.addEventListener("click", function () {
        slika.src = "https://cdng.europosters.eu/pod_public/1300/121020.jpg";
        slika.alt = "Druga slika - novi primjer";

        gumb.textContent = "Slika je promijenjena!";
      });
      const link = document.getElementById("l1");
      const b10 = document.getElementById("b10");
      b10.addEventListener("click", function () {
        link.href = "https://www.google.com/?hl=hr";
      });
      const b121 = document.getElementById("push");
      function omoguci() {
        document.getElementById("push").disabled = false;
      }
      function onemoguci() {
        document.getElementById("push").disabled = true;
      }
      let c = 0;
      let a = document.getElementById("p19");
      function povecaj() {
        if (c < 10) {
          c += 1;
          a.textContent = c;
        } else {
          a.style.color = "pink";
        }
      }
      function promijeniTemu() {
      const kartica = document.getElementById("kartica");

      kartica.classList.toggle("svijetla");
      kartica.classList.toggle("tamna");
    }
    </script>
