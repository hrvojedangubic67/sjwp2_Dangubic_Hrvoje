<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <canvas style="border: 1px solid rgb(0, 0, 0);" id="mycanvas" width="600" height="600">

</canvas>
<script>
    let c=document.getElementById("mycanvas");
    let ctx=c.getContext("2d");
    
    ctx.beginPath();
    ctx.rect(100,200,400,300);
    ctx.fillStyle="blue";
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(100,200);
    ctx.lineTo(500,200);
    ctx.lineTo(300,10);
    ctx.lineTo(100,10);
    ctx.stroke();
    
    

</script>    



</body>
</html>
